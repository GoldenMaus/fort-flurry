<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fort Flurry render gallery</title>
<style>
  html, body { height: 100%; margin: 0; overflow: hidden; background: #dfe6f6; font: 13px system-ui, sans-serif; }
  #game { position: absolute; inset: 0; width: 100%; height: 100%; }
  #panel { position: absolute; left: 8px; top: 8px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 6px 8px;
    background: rgba(44, 46, 96, 0.72); color: #fff; border-radius: 10px; max-width: calc(100% - 32px); }
  #panel select, #panel input, #panel button { font: inherit; }
  #stats { font-variant-numeric: tabular-nums; min-width: 12em; }
  body.bare #panel { display: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="panel">
  <label>scene <select id="scene"></select></label>
  <label>map <select id="map"></select></label>
  <label>time <select id="day"></select></label>
  <label><input type="checkbox" id="blizzard"> blizzard</label>
  <label>quality <select id="quality"><option>high</option><option>low</option><option>auto</option></select></label>
  <label><input type="checkbox" id="run" checked> run</label>
  <span id="stats"></span>
</div>
<script type="module" src="render-gallery.js"></script>
</body>
</html>
