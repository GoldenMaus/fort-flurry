<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Fort Flurry</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Fort Flurry">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#4f63ad">
  <meta name="description" content="Build a snow fort with up to 8 friends, then defend Colonel Carrot in a giant snowball fight.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%234f63ad'/%3E%3Ccircle cx='32' cy='34' r='21' fill='%23fff'/%3E%3Cpath d='M30 30 50 35 30 40z' fill='%23f08a24'/%3E%3Ccircle cx='24' cy='27' r='3' fill='%232a2c66'/%3E%3Ccircle cx='38' cy='27' r='3' fill='%232a2c66'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <canvas id="game"></canvas>
    <div id="hud" hidden></div>
    <div id="screens"></div>
    <div id="dialogs"></div>
    <div id="boot">Packing snow...</div>
  </div>
  <script>
    setTimeout(function () {
      var boot = document.getElementById('boot');
      if (boot) boot.textContent = 'Fort Flurry needs a newer browser (Safari 16.4, Chrome 111 or Firefox 114).';
    }, 8000);
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
